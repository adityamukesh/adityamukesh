<svg xmlns="http://www.w3.org/2000/svg" width="830" height="348" viewBox="0 0 830 348" role="img" aria-labelledby="title desc">
<title id="title">Aditya Mukesh — Building useful software, in the open.</title>
<desc id="desc">Open-source contributor focused on performance, reliability and developer tooling. Merged work in Kubernetes, OpenTelemetry and Valkey.</desc>
<defs>
<linearGradient id="ink"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
<linearGradient id="edge"><stop stop-color="#5eead4"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#6366f1" stop-opacity=".22"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.cursor{animation:blink 1.5s steps(2,end) infinite}
@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.cursor{animation:none}}
</style>
<rect width="830" height="348" rx="18" fill="#090e18"/>
<ellipse cx="710" cy="140" rx="200" ry="185" fill="url(#halo)"/>
<path d="M25 1H805" stroke="url(#edge)"/>
<text x="30" y="35" class="mono" font-size="10" letter-spacing="2.3" fill="#5eead4">ADITYAMUKESH / OPEN-SOURCE ENGINEERING</text>
<text x="26" y="116" font-size="72" letter-spacing="-3.5" font-weight="750" fill="url(#ink)">Aditya Mukesh<tspan fill="#5eead4">.</tspan></text>
<text x="30" y="163" font-size="26" letter-spacing="-.5" fill="#e2e8f0">Building useful software, in the open.</text>
<text x="31" y="195" font-size="14" fill="#8fa1bc">Performance. Reliability. Developer tooling.</text>
<path d="M31 224H799" stroke="#233044"/>
<text x="31" y="255" class="mono" font-size="11" fill="#5eead4">$ git log --merged</text>
<rect x="31" y="273" width="100" height="29" rx="7" fill="#15253b"/>
<text x="45" y="292" font-size="12" fill="#93c5fd">Kubernetes</text>
<rect x="141" y="273" width="132" height="29" rx="7" fill="#28251c"/>
<text x="155" y="292" font-size="12" fill="#fcd34d">OpenTelemetry</text>
<rect x="283" y="273" width="77" height="29" rx="7" fill="#102a2b"/>
<text x="299" y="292" font-size="12" fill="#5eead4">Valkey</text>
<text x="535" y="261" class="mono" font-size="11" fill="#7486a1">// the workflow</text>
<text x="535" y="287" class="mono" font-size="12" fill="#c4b5fd">understand → build → verify</text>
<text x="535" y="312" class="mono" font-size="12" fill="#c4b5fd">→ contribute</text><rect class="cursor" x="638" y="301" width="7" height="13" fill="#5eead4"/>
</svg>

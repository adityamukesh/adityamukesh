<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 220" width="410" height="220" fill="none">
  <title>Data Structures &amp; Algorithms</title>
  <defs>
    <linearGradient id="cbg-dsa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111820"/>
      <stop offset="100%" stop-color="#0a0f14"/>
    </linearGradient>
    <linearGradient id="laser-h-dsa" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#56d364" stop-opacity="0"/>
      <stop offset="40%" stop-color="#56d364" stop-opacity="1"/>
      <stop offset="60%" stop-color="#56d364" stop-opacity="1"/>
      <stop offset="100%" stop-color="#56d364" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="3.8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="laser-v-dsa" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#56d364" stop-opacity="0"/>
      <stop offset="40%" stop-color="#56d364" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#56d364" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#56d364" stop-opacity="0"/>
      <animate attributeName="y1" values="-100%;100%" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="0%;200%" dur="5.2s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="cg-dsa" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#238636" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tg-dsa" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="60%" stop-color="#cdd9e5"/>
      <stop offset="100%" stop-color="#7ee787"/>
      <animate attributeName="x2" values="100%;140%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bg2-dsa" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#56d364" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#56d364" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pd2{0%,100%{r:3;opacity:1}50%{r:5;opacity:0.1}}
    @keyframes cardPulse2{0%,100%{opacity:0.18}50%{opacity:0.08}}
    .dp2{ animation:pd2 2.5s ease-in-out infinite; }
    .cga2{ animation:cardPulse2 4.2s ease-in-out infinite; }
  </style>

  <rect x="0.5" y="0.5" width="409" height="219" rx="14" fill="url(#cbg-dsa)" stroke="#21262d" stroke-width="1"/>
  <rect width="410" height="220" rx="14" fill="url(#cg-dsa)" class="cga2"/>
  <rect x="0" y="150" width="410" height="70" rx="0" fill="url(#bg2-dsa)"/>

  <line x1="14" y1="1" x2="396" y2="1" stroke="url(#laser-h-dsa)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="1" y1="14" x2="1" y2="206" stroke="url(#laser-v-dsa)" stroke-width="1.5" stroke-linecap="round"/>

  <circle cx="20" cy="20" r="3" fill="#56d364" class="dp2"/>
  <circle cx="20" cy="20" r="1.5" fill="#56d364"/>

  <!-- Top right badge -->
  <rect x="335" y="14" width="60" height="18" rx="9" fill="rgba(86,211,100,0.12)" stroke="rgba(86,211,100,0.35)" stroke-width="0.75"/>
  <circle cx="345" cy="23" r="2.5" fill="#56d364">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="372" y="27" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9" font-weight="600" letter-spacing="1" fill="#56d364">↗ CODE</text>

  <!-- category badge -->
  <rect x="36" y="14" width="160" height="18" rx="9" fill="rgba(86,211,100,0.12)" stroke="rgba(86,211,100,0.35)" stroke-width="0.75"/>
  <text x="46" y="26.5" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9" font-weight="700" letter-spacing="1.5" fill="#56d364">ALGORITHMS · CORE CS</text>

  <!-- title -->
  <text x="24" y="76" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="-0.5" fill="url(#tg-dsa)">DSA 301 Solutions</text>

  <!-- desc -->
  <text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#7d8590">
    <tspan x="24" y="104">Structured implementations of key data structures,</tspan>
    <tspan x="24" dy="18">graph algorithms, dynamic programming &amp; search problems.</tspan>
  </text>

  <line x1="24" y1="145" x2="386" y2="145" stroke="#21262d" stroke-width="0.75"/>

  <!-- tech chips -->
  <g transform="translate(0, 157)">
    <rect x="24" y="0" width="55" height="22" rx="11" fill="rgba(86,211,100,0.1)" stroke="rgba(86,211,100,0.25)" stroke-width="1"/>
    <text x="51" y="14.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#7ee787">C++</text>
    <rect x="87" y="0" width="65" height="22" rx="11" fill="rgba(86,211,100,0.1)" stroke="rgba(86,211,100,0.25)" stroke-width="1"/>
    <text x="119" y="14.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#7ee787">Python</text>
    <rect x="160" y="0" width="95" height="22" rx="11" fill="rgba(86,211,100,0.1)" stroke="rgba(86,211,100,0.25)" stroke-width="1"/>
    <text x="207" y="14.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#7ee787">Algorithms</text>
    <rect x="263" y="0" width="115" height="22" rx="11" fill="rgba(86,211,100,0.1)" stroke="rgba(86,211,100,0.25)" stroke-width="1"/>
    <text x="320" y="14.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#7ee787">Data Structures</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 220" width="410" height="220" fill="none">
  <title>Open Source &amp; Internships</title>
  <defs>
    <linearGradient id="cbg-os" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111820"/>
      <stop offset="100%" stop-color="#0a0f14"/>
    </linearGradient>
    <linearGradient id="laser-h-os" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0"/>
      <stop offset="40%" stop-color="#a371f7" stop-opacity="1"/>
      <stop offset="60%" stop-color="#a371f7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="3.6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="laser-v-os" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0"/>
      <stop offset="40%" stop-color="#a371f7" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#a371f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
      <animate attributeName="y1" values="-100%;100%" dur="5.1s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="0%;200%" dur="5.1s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="cg-os" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tg-os" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="60%" stop-color="#cdd9e5"/>
      <stop offset="100%" stop-color="#d2a8ff"/>
      <animate attributeName="x2" values="100%;140%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bg2-os" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pd3{0%,100%{r:3;opacity:1}50%{r:5;opacity:0.1}}
    @keyframes cardPulse3{0%,100%{opacity:0.18}50%{opacity:0.08}}
    .dp3{ animation:pd3 2.4s ease-in-out infinite; }
    .cga3{ animation:cardPulse3 3.8s ease-in-out infinite; }
  </style>

  <rect x="0.5" y="0.5" width="409" height="219" rx="14" fill="url(#cbg-os)" stroke="#21262d" stroke-width="1"/>
  <rect width="410" height="220" rx="14" fill="url(#cg-os)" class="cga3"/>
  <rect x="0" y="150" width="410" height="70" rx="0" fill="url(#bg2-os)"/>

  <line x1="14" y1="1" x2="396" y2="1" stroke="url(#laser-h-os)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="1" y1="14" x2="1" y2="206" stroke="url(#laser-v-os)" stroke-width="1.5" stroke-linecap="round"/>

  <circle cx="20" cy="20" r="3" fill="#a371f7" class="dp3"/>
  <circle cx="20" cy="20" r="1.5" fill="#a371f7"/>

  <!-- Top right badge -->
  <rect x="330" y="14" width="65" height="18" rx="9" fill="rgba(163,113,247,0.12)" stroke="rgba(163,113,247,0.35)" stroke-width="0.75"/>
  <circle cx="340" cy="23" r="2.5" fill="#a371f7">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <text x="367" y="27" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9" font-weight="600" letter-spacing="1" fill="#a371f7">↗ OPEN</text>

  <!-- category badge -->
  <rect x="36" y="14" width="168" height="18" rx="9" fill="rgba(163,113,247,0.12)" stroke="rgba(163,113,247,0.35)" stroke-width="0.75"/>
  <text x="46" y="26.5" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9" font-weight="700" letter-spacing="1.5" fill="#a371f7">COMMUNITY · PROGRAMS</text>

  <!-- title -->
  <text x="24" y="76" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="-0.5" fill="url(#tg-os)">Open Source Hub</text>

  <!-- desc -->
  <text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#7d8590">
    <tspan x="24" y="104">Accurate curation of open-source internships, program</tspan>
    <tspan x="24" dy="18">timelines, contribution guidelines &amp; developer opportunities.</tspan>
  </text>

  <line x1="24" y1="145" x2="386" y2="145" stroke="#21262d" stroke-width="0.75"/>

  <!-- tech chips -->
  <g transform="translate(0, 157)">
    <rect x="24" y="0" width="80" height="22" rx="11" fill="rgba(163,113,247,0.1)" stroke="rgba(163,113,247,0.25)" stroke-width="1"/>
    <text x="64" y="14.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#d2a8ff">Open Source</text>
    <rect x="112" y="0" width="70" height="22" rx="11" fill="rgba(163,113,247,0.1)" stroke="rgba(163,113,247,0.25)" stroke-width="1"/>
    <text x="147" y="14.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#d2a8ff">GitHub</text>
    <rect x="190" y="0" width="85" height="22" rx="11" fill="rgba(163,113,247,0.1)" stroke="rgba(163,113,247,0.25)" stroke-width="1"/>
    <text x="232" y="14.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#d2a8ff">Community</text>
    <rect x="283" y="0" width="95" height="22" rx="11" fill="rgba(163,113,247,0.1)" stroke="rgba(163,113,247,0.25)" stroke-width="1"/>
    <text x="330" y="14.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#d2a8ff">Internships</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 148" width="830" height="148" fill="none">
  <title>Engineering Skills</title>
  <defs>
    <linearGradient id="bg-col" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111820"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="l1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0"/>
      <stop offset="50%" stop-color="#79c0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="l2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#56d364" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7ee787" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#56d364" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="l3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e3b341" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f0c963" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e3b341" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pdot { 0%,100%{r:2.5;opacity:1} 50%{r:4;opacity:0.2} }
    .col-label{ font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; font-size:10px; font-weight:600; letter-spacing:2px; }
    .chip-t{ font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; font-size:10.5px; font-weight:500; fill:#adbac7; }
    .d1{ animation:pdot 2s infinite; transform-origin:18px 22px; }
    .d2{ animation:pdot 2.4s infinite; transform-origin:18px 22px; }
    .d3{ animation:pdot 2.8s infinite; transform-origin:18px 22px; }
  </style>

  <!-- Column 1: Languages -->
  <rect x="0.5" y="0.5" width="257" height="147" rx="12" fill="url(#bg-col)" stroke="#21262d"/>
  <line x1="14" y1="1" x2="244" y2="1" stroke="url(#l1)" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="18" cy="22" r="2.5" fill="#388bfd" class="d1"/>
  <text x="28" y="26" class="col-label" fill="#388bfd">LANGUAGES</text>
  <!-- chips row 1 -->
  <rect x="16" y="44" width="46" height="20" rx="10" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.2)"/>
  <text x="39" y="58" text-anchor="middle" class="chip-t">C++</text>
  <rect x="68" y="44" width="60" height="20" rx="10" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.2)"/>
  <text x="98" y="58" text-anchor="middle" class="chip-t">Python</text>
  <rect x="134" y="44" width="86" height="20" rx="10" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.2)"/>
  <text x="177" y="58" text-anchor="middle" class="chip-t">JavaScript</text>
  <!-- row 2 -->
  <rect x="16" y="74" width="90" height="20" rx="10" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.2)"/>
  <text x="61" y="88" text-anchor="middle" class="chip-t">TypeScript</text>
  <rect x="112" y="74" width="48" height="20" rx="10" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.2)"/>
  <text x="136" y="88" text-anchor="middle" class="chip-t">SQL</text>

  <!-- Column 2: Web & Backend -->
  <rect x="287.5" y="0.5" width="257" height="147" rx="12" fill="url(#bg-col)" stroke="#21262d"/>
  <line x1="301" y1="1" x2="531" y2="1" stroke="url(#l2)" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="305" cy="22" r="2.5" fill="#56d364" class="d2"/>
  <text x="315" y="26" class="col-label" fill="#56d364">WEB &amp; BACKEND</text>
  <!-- row 1 -->
  <rect x="303" y="44" width="60" height="20" rx="10" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.2)"/>
  <text x="333" y="58" text-anchor="middle" class="chip-t">React</text>
  <rect x="369" y="44" width="68" height="20" rx="10" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.2)"/>
  <text x="403" y="58" text-anchor="middle" class="chip-t">Node.js</text>
  <rect x="443" y="44" width="68" height="20" rx="10" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.2)"/>
  <text x="477" y="58" text-anchor="middle" class="chip-t">Express</text>
  <!-- row 2 -->
  <rect x="303" y="74" width="84" height="20" rx="10" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.2)"/>
  <text x="345" y="88" text-anchor="middle" class="chip-t">REST APIs</text>
  <rect x="393" y="74" width="94" height="20" rx="10" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.2)"/>
  <text x="440" y="88" text-anchor="middle" class="chip-t">HTML5/CSS3</text>
  <!-- row 3 -->
  <rect x="303" y="104" width="94" height="20" rx="10" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.2)"/>
  <text x="350" y="118" text-anchor="middle" class="chip-t">Tailwind CSS</text>

  <!-- Column 3: Data & Infra -->
  <rect x="573.5" y="0.5" width="256" height="147" rx="12" fill="url(#bg-col)" stroke="#21262d"/>
  <line x1="587" y1="1" x2="816" y2="1" stroke="url(#l3)" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="591" cy="22" r="2.5" fill="#e3b341" class="d3"/>
  <text x="601" y="26" class="col-label" fill="#e3b341">DATA &amp; TOOLS</text>
  <!-- row 1 -->
  <rect x="589" y="44" width="76" height="20" rx="10" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.2)"/>
  <text x="627" y="58" text-anchor="middle" class="chip-t">MongoDB</text>
  <rect x="671" y="44" width="86" height="20" rx="10" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.2)"/>
  <text x="714" y="58" text-anchor="middle" class="chip-t">PostgreSQL</text>
  <!-- row 2 -->
  <rect x="589" y="74" width="102" height="20" rx="10" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.2)"/>
  <text x="640" y="88" text-anchor="middle" class="chip-t">Git &amp; GitHub</text>
  <rect x="697" y="74" width="60" height="20" rx="10" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.2)"/>
  <text x="727" y="88" text-anchor="middle" class="chip-t">Linux</text>
  <!-- row 3 -->
  <rect x="589" y="104" width="76" height="20" rx="10" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.2)"/>
  <text x="627" y="118" text-anchor="middle" class="chip-t">Postman</text>
  <rect x="671" y="104" width="72" height="20" rx="10" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.2)"/>
  <text x="707" y="118" text-anchor="middle" class="chip-t">VS Code</text>
</svg>

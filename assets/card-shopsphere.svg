<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 220" width="410" height="220" fill="none">
  <title>ShopSphere</title>
  <defs>
    <linearGradient id="cbg-ss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111820"/>
      <stop offset="100%" stop-color="#0a0f14"/>
    </linearGradient>
    <linearGradient id="laser-h-ss" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0"/>
      <stop offset="40%" stop-color="#388bfd" stop-opacity="1"/>
      <stop offset="60%" stop-color="#388bfd" stop-opacity="1"/>
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="laser-v-ss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0"/>
      <stop offset="40%" stop-color="#388bfd" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#388bfd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0"/>
      <animate attributeName="y1" values="-100%;100%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="0%;200%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="cg-ss" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tg-ss" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="60%" stop-color="#cdd9e5"/>
      <stop offset="100%" stop-color="#58a6ff"/>
      <animate attributeName="x2" values="100%;140%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bg2-ss" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pd{0%,100%{r:3;opacity:1}50%{r:5;opacity:0.1}}
    @keyframes cardPulse{0%,100%{opacity:0.18}50%{opacity:0.08}}
    .dp{ animation:pd 2.3s ease-in-out infinite; }
    .cga{ animation:cardPulse 4s ease-in-out infinite; }
  </style>

  <rect x="0.5" y="0.5" width="409" height="219" rx="14" fill="url(#cbg-ss)" stroke="#21262d" stroke-width="1"/>
  <rect width="410" height="220" rx="14" fill="url(#cg-ss)" class="cga"/>
  <rect x="0" y="150" width="410" height="70" rx="0" fill="url(#bg2-ss)"/>

  <line x1="14" y1="1" x2="396" y2="1" stroke="url(#laser-h-ss)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="1" y1="14" x2="1" y2="206" stroke="url(#laser-v-ss)" stroke-width="1.5" stroke-linecap="round"/>

  <circle cx="20" cy="20" r="3" fill="#58a6ff" class="dp"/>
  <circle cx="20" cy="20" r="1.5" fill="#58a6ff"/>

  <!-- LIVE badge (top right) -->
  <rect x="325" y="14" width="70" height="18" rx="9" fill="rgba(56,139,253,0.12)" stroke="rgba(56,139,253,0.35)" stroke-width="0.75"/>
  <circle cx="335" cy="23" r="2.5" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="366" y="27" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9" font-weight="600" letter-spacing="1" fill="#58a6ff">↗ GITHUB</text>

  <!-- category badge -->
  <rect x="36" y="14" width="168" height="18" rx="9" fill="rgba(56,139,253,0.12)" stroke="rgba(56,139,253,0.35)" stroke-width="0.75"/>
  <text x="46" y="26.5" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9" font-weight="700" letter-spacing="1.5" fill="#388bfd">FULL-STACK · PLATFORM</text>

  <!-- title -->
  <text x="24" y="76" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="-0.5" fill="url(#tg-ss)">ShopSphere</text>

  <!-- desc -->
  <text font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#7d8590">
    <tspan x="24" y="104">Modern full-stack e-commerce web platform featuring</tspan>
    <tspan x="24" dy="18">product catalog, JWT auth, cart &amp; responsive UI.</tspan>
  </text>

  <line x1="24" y1="145" x2="386" y2="145" stroke="#21262d" stroke-width="0.75"/>

  <!-- tech chips -->
  <g transform="translate(0, 157)">
    <rect x="24" y="0" width="60" height="22" rx="11" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.22)" stroke-width="1"/>
    <text x="54" y="14.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#79c0ff">React</text>
    <rect x="92" y="0" width="70" height="22" rx="11" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.22)" stroke-width="1"/>
    <text x="127" y="14.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#79c0ff">Node.js</text>
    <rect x="170" y="0" width="70" height="22" rx="11" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.22)" stroke-width="1"/>
    <text x="205" y="14.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#79c0ff">Express</text>
    <rect x="248" y="0" width="80" height="22" rx="11" fill="rgba(56,139,253,0.1)" stroke="rgba(56,139,253,0.22)" stroke-width="1"/>
    <text x="288" y="14.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#79c0ff">MongoDB</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="830" height="138" viewBox="0 0 830 138" role="img"><title>How I approach contributions</title><defs><linearGradient id="surface" x2="1" y2="1"><stop stop-color="#152238"/><stop offset="1" stop-color="#0b1220"/></linearGradient></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}</style><rect x=".5" y=".5" width="829" height="137" rx="16" fill="url(#surface)" stroke="#29394f"/><text x="24" y="37" font-size="16" fill="#67e8f9" font-weight="600">Understand the problem</text><text x="24" y="71" font-size="12" fill="#a9bad1" font-weight="400">Follow the existing architecture.</text><text x="24" y="93" font-size="12" fill="#a9bad1" font-weight="400">Make the smallest useful change.</text><text x="302" y="37" font-size="16" fill="#c4b5fd" font-weight="600">Prove the behavior</text><text x="302" y="71" font-size="12" fill="#a9bad1" font-weight="400">Reproduce issues and test fixes.</text><text x="302" y="93" font-size="12" fill="#a9bad1" font-weight="400">Check edge cases and regressions.</text><text x="580" y="37" font-size="16" fill="#6ee7b7" font-weight="600">Make it maintainable</text><text x="580" y="71" font-size="12" fill="#a9bad1" font-weight="400">Keep changes focused.</text><text x="580" y="93" font-size="12" fill="#a9bad1" font-weight="400">Document decisions and limitations.</text></svg>

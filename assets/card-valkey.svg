<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 195" width="830" height="195" fill="none">
  <title>Valkey Core Contributor - Merged PR #4843</title>
  <defs>
    <linearGradient id="bg-vk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111822"/>
      <stop offset="100%" stop-color="#0a0f16"/>
    </linearGradient>

    <!-- Glowing top border animation -->
    <linearGradient id="laser-vk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0"/>
      <stop offset="25%" stop-color="#8957e5" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#d2a8ff" stop-opacity="1"/>
      <stop offset="75%" stop-color="#8957e5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#21262d" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;100%" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- High-visibility merged glow -->
    <radialGradient id="glow-merged" cx="88%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-ambient" cx="10%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#d2a8ff"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse-dot {
      0%, 100% { r: 3.5; opacity: 1; }
      50% { r: 5.5; opacity: 0.3; }
    }
    @keyframes badge-glow {
      0%, 100% { stroke: #a371f7; }
      50% { stroke: #d2a8ff; }
    }
    .p-dot { animation: pulse-dot 2.2s ease-in-out infinite; }
    .merged-badge { animation: badge-glow 2.5s ease-in-out infinite; }
    .badge-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 9.5px; font-weight: 700; letter-spacing: 1.2px;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 17px; font-weight: 700; letter-spacing: -0.2px;
    }
    .desc-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 12.5px; font-weight: 400; fill: #8b949e;
    }
    .chip-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 10px; font-weight: 600;
    }
  </style>

  <!-- Base Card & Glows -->
  <rect x="0.5" y="0.5" width="829" height="194" rx="12" fill="url(#bg-vk)" stroke="#21262d" stroke-width="1"/>
  <rect width="830" height="195" rx="12" fill="url(#glow-ambient)"/>
  <rect width="830" height="195" rx="12" fill="url(#glow-merged)"/>
  <line x1="14" y1="1" x2="816" y2="1" stroke="url(#laser-vk)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Top Bar -->
  <!-- Left: Target Repository & Linux Foundation Ownership -->
  <g transform="translate(24, 18)">
    <circle cx="5" cy="10" r="3.5" fill="#a371f7" class="p-dot"/>
    <circle cx="5" cy="10" r="1.8" fill="#ffffff"/>
    <rect x="18" y="0" width="350" height="20" rx="10" fill="rgba(163,113,247,0.12)" stroke="rgba(163,113,247,0.4)" stroke-width="0.8"/>
    <text x="28" y="14" class="badge-mono" fill="#d2a8ff">VALKEY-IO / VALKEY · LINUX FOUNDATION PROJECT</text>
  </g>

  <!-- Right: UNMISSABLE MERGED BADGE -->
  <g transform="translate(620, 16)">
    <!-- GitHub Merged Pill -->
    <rect x="0" y="0" width="186" height="24" rx="12" fill="#8957e5" fill-opacity="0.22" stroke="#a371f7" stroke-width="1.2" class="merged-badge"/>
    <!-- Git Merged Icon Graphic -->
    <circle cx="16" cy="12" r="4" fill="#a371f7"/>
    <circle cx="16" cy="12" r="2" fill="#ffffff"/>
    <text x="27" y="16" class="badge-mono" fill="#ffffff">🟣 MERGED PR #4843 ↗</text>
  </g>

  <!-- Pull Request Title -->
  <text x="24" y="74" class="title-text" fill="url(#title-grad)">Fix XACKDEL KEEPREF reply for acked entry whose stream item is gone</text>

  <!-- Explanation / Impact -->
  <text class="desc-text">
    <tspan x="24" y="99">Successfully merged into <tspan fill="#d2a8ff" font-weight="600">valkey-io/valkey:unstable</tspan> — Hosted &amp; tracked under <tspan fill="#79c0ff" font-weight="600">The Linux Foundation</tspan> governance.</tspan>
    <tspan x="24" y="117">Fixed protocol reply logic in core engine when an entry is acknowledged in PEL but stream item is gone (Fixes #4840).</tspan>
  </text>

  <!-- Separator Line -->
  <line x1="24" y1="137" x2="806" y2="137" stroke="#21262d" stroke-width="0.75"/>

  <!-- Bottom Row: Tech Stack & Verification -->
  <g transform="translate(24, 151)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="82" height="22" rx="11" fill="rgba(137,87,229,0.2)" stroke="#8957e5" stroke-width="1"/>
    <text x="41" y="14.5" text-anchor="middle" class="chip-text" fill="#d2a8ff">✓ MERGED</text>

    <!-- Linux Foundation Chip -->
    <rect x="90" y="0" width="128" height="22" rx="11" fill="rgba(56,139,253,0.15)" stroke="rgba(56,139,253,0.35)" stroke-width="1"/>
    <text x="154" y="14.5" text-anchor="middle" class="chip-text" fill="#79c0ff">Linux Foundation</text>

    <!-- Module Scope -->
    <rect x="226" y="0" width="145" height="22" rx="11" fill="rgba(163,113,247,0.12)" stroke="rgba(163,113,247,0.3)" stroke-width="1"/>
    <text x="298.5" y="14.5" text-anchor="middle" class="chip-text" fill="#d2a8ff">C · Streams (t_stream.c)</text>

    <!-- Command schema -->
    <rect x="379" y="0" width="95" height="22" rx="11" fill="rgba(63,185,80,0.12)" stroke="rgba(63,185,80,0.3)" stroke-width="1"/>
    <text x="426.5" y="14.5" text-anchor="middle" class="chip-text" fill="#3fb950">xackdel.json</text>

    <!-- Tests -->
    <rect x="482" y="0" width="85" height="22" rx="11" fill="rgba(240,136,62,0.12)" stroke="rgba(240,136,62,0.3)" stroke-width="1"/>
    <text x="524.5" y="14.5" text-anchor="middle" class="chip-text" fill="#ffa657">TCL Tests</text>

    <!-- Milestone -->
    <rect x="575" y="0" width="85" height="22" rx="11" fill="rgba(163,113,247,0.12)" stroke="rgba(163,113,247,0.3)" stroke-width="1"/>
    <text x="617.5" y="14.5" text-anchor="middle" class="chip-text" fill="#a371f7">Valkey 9.2</text>

    <!-- Maintainer note -->
    <text x="782" y="15" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#3fb950">● Merged by Maintainers</text>
  </g>
</svg>
